name: Feature (app)
description: A piece of the app (Cofounder A, app/)
title: "[app] "
labels: ["app"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the student can see or do when this is done.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] 
        - [ ] Works at laptop width and at 375 px
        - [ ] `npm run check` passes
    validations:
      required: true
  - type: input
    id: hours
    attributes:
      label: Estimate (hours, 1–4)
    validations:
      required: true
  - type: input
    id: blocked
    attributes:
      label: Blocked by
      placeholder: "#N, or none"
